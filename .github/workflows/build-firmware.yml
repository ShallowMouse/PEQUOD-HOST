name: Build controller firmware

on:
  push:
    branches: [ main ]
    paths: [ 'Controller/**', '.github/workflows/build-firmware.yml' ]
  pull_request:
    paths: [ 'Controller/**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core and libraries
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli lib install "ArduinoJson" "Adafruit SSD1306" "Adafruit GFX Library"
          arduino-cli core list
          arduino-cli lib list

      - name: Compile
        shell: bash
        run: |
          set -o pipefail
          FQBN="esp32:esp32:esp32s3:USBMode=default,CDCOnBoot=default,PartitionScheme=default"
          if ! arduino-cli compile --fqbn "$FQBN" --warnings default --output-dir build Controller/PEQUOD_FC 2>&1 | tee compile.log; then
            msg=$(grep -E "error|Error" compile.log | head -50 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=compile::$msg"
            exit 1
          fi
          ls -la build

      - name: Package
        run: |
          mkdir -p dist
          cp build/PEQUOD_FC.ino.bin dist/PEQUOD_FC.bin
          cp build/PEQUOD_FC.ino.merged.bin dist/PEQUOD_FC-full.bin 2>/dev/null || true
          cp -r Controller/PEQUOD_FC dist/source

      - uses: actions/upload-artifact@v4
        with:
          name: PEQUOD-FC-Firmware
          path: dist/
