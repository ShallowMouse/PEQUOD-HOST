name: Build Windows

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths-ignore: [ 'Controller/**', 'docs/**', '.github/workflows/build-firmware.yml' ]
  pull_request:
  workflow_dispatch:

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core and libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli config set library.enable_unsafe_install true
          arduino-cli core update-index
          arduino-cli core install esp32:esp32${{ vars.ESP32_CORE && format('@{0}', vars.ESP32_CORE) || '' }}
          arduino-cli lib install "FastLED" "Adafruit GFX Library" "Adafruit SSD1306" "Adafruit BusIO" "ArduinoJson@6.21.5"
          arduino-cli lib install --git-url https://github.com/tttapa/Control-Surface.git

      - name: Compile controller firmware
        run: |
          set -o pipefail
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32s3:USBMode=default,CDCOnBoot=default,PartitionScheme=min_spiffs" \
            --output-dir out Firmware/Master22 2>&1 | tee fw.log || {
              msg=$(grep -E "error|Error" fw.log | head -40 | sed ':a;N;$!ba;s/\n/%0A/g'); echo "::error title=firmware::$msg"; exit 1; }
          mkdir -p fw
          cp out/Master22.ino.bin fw/controller.bin
          grep -oP '#define PQ_FW_VERSION\s+"\K[^"]+' Firmware/Master22/PequodLink.h > fw/version.txt
          ls -la fw; cat fw/version.txt

      - uses: actions/upload-artifact@v4
        with:
          name: controller-firmware
          path: fw/

  build:
    runs-on: windows-latest
    needs: firmware

    steps:
      - uses: actions/checkout@v4

      - name: Get controller firmware
        uses: actions/download-artifact@v4
        with:
          name: controller-firmware
          path: Resources/Firmware

      - name: Configure
        shell: pwsh
        run: |
          # Let CMake pick the newest installed Visual Studio.
          cmake -S . -B build -A x64 *>&1 | Tee-Object -FilePath configure.log
          if ($LASTEXITCODE -ne 0) {
            $msg = (Get-Content configure.log -Tail 60) -join "%0A"; Write-Output "::error title=configure::$msg"
            exit 1
          }

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel -- /v:minimal *>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            $msg = (Select-String -Path build.log -Pattern "error" | Select-Object -First 60 | ForEach-Object { $_.Line }) -join "%0A"; Write-Output "::error title=build::$msg"
            exit 1
          }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "build/PequodHost_artefacts/Release/PEQUOD Host.exe" dist/
          Copy-Item README.md dist/
          Copy-Item Resources/Fonts/*.txt dist/
          New-Item -ItemType Directory -Force "dist/Controller firmware" | Out-Null
          Copy-Item -Recurse Firmware/Master22 "dist/Controller firmware/"
          Copy-Item Resources/Firmware/controller.bin "dist/Controller firmware/"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: PEQUOD-Host-Windows
          path: dist/

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PEQUOD Host.exe
