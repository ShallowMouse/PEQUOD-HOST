name: Build Windows

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: pwsh
        run: |
          # Let CMake pick the newest installed Visual Studio.
          cmake -S . -B build -A x64 *>&1 | Tee-Object -FilePath configure.log
          if ($LASTEXITCODE -ne 0) {
            $msg = (Get-Content configure.log -Tail 60) -join "%0A"; Write-Output "::error title=configure::$msg"
            exit 1
          }

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel -- /v:minimal *>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            $msg = (Select-String -Path build.log -Pattern "error" | Select-Object -First 60 | ForEach-Object { $_.Line }) -join "%0A"; Write-Output "::error title=build::$msg"
            exit 1
          }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "build/PequodHost_artefacts/Release/PEQUOD Host.exe" dist/
          Copy-Item README.md dist/
          Copy-Item Resources/Fonts/*.txt dist/

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: PEQUOD-Host-Windows
          path: dist/

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PEQUOD Host.exe
