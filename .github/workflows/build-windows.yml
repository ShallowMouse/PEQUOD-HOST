name: Build Windows

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths-ignore: [ 'docs/**' ]
  pull_request:
  workflow_dispatch:

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core and libraries
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli lib install "ArduinoJson" "Adafruit SSD1306" "Adafruit GFX Library"

      - name: Compile controller firmware (PEQUOD FC)
        shell: bash
        run: |
          set -o pipefail
          FQBN="esp32:esp32:esp32s3:USBMode=default,CDCOnBoot=default,PartitionScheme=default"
          if ! arduino-cli compile --fqbn "$FQBN" --warnings default --output-dir out Controller/PEQUOD_FC 2>&1 | tee fw.log; then
            msg=$(grep -E "error|Error" fw.log | head -50 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=firmware::$msg"
            exit 1
          fi
          size=$(grep -E "Sketch uses" fw.log | head -1)
          echo "::notice title=firmware size::$size"
          mkdir -p fw
          cp out/PEQUOD_FC.ino.bin fw/PEQUOD_FC.bin
          cp out/PEQUOD_FC.ino.merged.bin fw/PEQUOD_FC-full.bin 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: PEQUOD-FC-Firmware
          path: fw/

  build:
    runs-on: windows-latest
    needs: firmware

    steps:
      - uses: actions/checkout@v4

      - name: Get controller firmware
        uses: actions/download-artifact@v4
        with:
          name: PEQUOD-FC-Firmware
          path: fw

      - name: Configure
        shell: pwsh
        run: |
          # Let CMake pick the newest installed Visual Studio.
          cmake -S . -B build -A x64 *>&1 | Tee-Object -FilePath configure.log
          if ($LASTEXITCODE -ne 0) {
            $msg = (Get-Content configure.log -Tail 60) -join "%0A"; Write-Output "::error title=configure::$msg"
            exit 1
          }

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel -- /v:minimal *>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            $msg = (Select-String -Path build.log -Pattern "error" | Select-Object -First 60 | ForEach-Object { $_.Line }) -join "%0A"; Write-Output "::error title=build::$msg"
            exit 1
          }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "build/PequodHost_artefacts/Release/PEQUOD Host.exe" dist/
          Copy-Item README.md dist/
          Copy-Item Resources/Fonts/*.txt dist/
          New-Item -ItemType Directory -Force "dist/Controller firmware" | Out-Null
          Copy-Item fw/*.bin "dist/Controller firmware/"
          Copy-Item Controller/README.md "dist/Controller firmware/"
          Copy-Item -Recurse Controller/PEQUOD_FC "dist/Controller firmware/source"
          Copy-Item docs/controller-protocol.md "dist/Controller firmware/"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: PEQUOD-Host-Windows
          path: dist/

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PEQUOD Host.exe
