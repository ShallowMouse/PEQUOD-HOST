[workspace]
resolver = "2"
members = ["vintage", "plugins/*", "spector/*", "hannett/*", "plank/*", "townhouse/*", "ford/*", "sombr/*", "pequod/*", "antonoff/*", "setzer/*", "may/*", "monkeys/*", "strokes/*", "blocparty/*", "blink/*", "pedals/*", "boingo/*", "amps/*", "cabs/*", "straits/*", "livingend/*", "puppets/*", "lanham/*", "finn/*", "eddy/*", "pequod_engine"]

[workspace.package]
version = "1.0.1"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683", default-features = false, features = ["vst3"] }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683" }
vintage = { path = "vintage" }

[profile.release]
lto = "thin"
strip = "symbols"
opt-level = 3
